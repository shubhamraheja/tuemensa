services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuemensa
      POSTGRES_PASSWORD: tuemensa   ## IMPORTANT: Change this in production!
      POSTGRES_DB: tuemensa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuemensa -d tuemensa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://tuemensa:tuemensa@db:5432/tuemensa
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${CLOUDFLARE_WORKERS_AI_TOKEN:-}
      POLLINATIONS_API_KEY: ${POLLINATIONS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - dish_images:/app/uploads/dish-images

  frontend:
    build: ./mobile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "8081:8081"

volumes:
  pgdata:
  dish_images:
