# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are overridden by the gradle.properties file.
# If you want to override this behavior, you can uncomment the following properties.
#action.excludeTransitiveGroups=true
#action.enableJetifier=true

# Android operating system, activity handling, memory, and file size.
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Increase the Java heap to process the explicit build config.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4

android.enableJetifier=true
android.useAndroidX=true

# Version
VERSION_NAME=1.0.0
VERSION_CODE=1
